[package]
name = "metalcraft-flows"
version = "0.2.2"
edition = "2024"
rust-version = "1.91"
description = "Specification and reference types for Flows — a serializable DAG format for AI agent workflows"
license = "MIT"
repository = "https://github.com/rust4ai/metalcraft-flows"
homepage = "https://github.com/rust4ai/metalcraft-flows"
documentation = "https://docs.rs/metalcraft-flows"
readme = "README.md"
keywords = ["ai", "agents", "graph", "flow", "workflow"]
categories = ["data-structures", "config"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
default = ["fs", "regex"]
fs = []
log = []
# The `matches` (regex) operator on `conditional` nodes. Without this feature,
# `matches` evaluates to false; every other operator works regardless.
regex = ["dep:regex"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
